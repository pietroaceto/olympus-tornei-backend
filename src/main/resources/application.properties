spring.application.name=backend

# In produzione (Render) la piattaforma assegna la porta dinamicamente via la
# env var PORT; in locale resta 8080 come default.
server.port=${PORT:8080}

# DB_SSL_MODE va valorizzata a "?sslmode=require" per Neon.tech (richiede
# SSL); vuota in locale (il Postgres di sviluppo via Podman non ha SSL).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:olympus_tornei}${DB_SSL_MODE:}
spring.datasource.username=${DB_USER:olympus}
spring.datasource.password=${DB_PASSWORD:olympus}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
